<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM 16 | Digital Library</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-main: #F9F8F4;      
            --sidebar-bg: #FFFFFF;
            --text-dark: #2B2824;    
            --text-light: #8A867D;   
            --accent: #D96C4A;       
            --border-color: #EAE6DF;
            
            --font-serif: 'Noto Serif Bengali', serif;
            --font-sans: 'Noto Sans Bengali', sans-serif;
        }

        body {
            margin: 0; padding: 0;
            font-family: var(--font-sans);
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex; min-height: 100vh; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ক্লিন সাইডবার (বাজে অপশন আউট!) --- */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            padding: 2.5rem 1.5rem;
            position: fixed; height: 100vh;
            box-sizing: border-box; z-index: 50;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.8rem; font-weight: 700;
            color: var(--text-dark);
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 3rem;
        }
        .logo i { color: var(--accent); }

        .nav-menu { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 1rem 1.2rem; border-radius: 12px;
            font-weight: 500; font-size: 1.05rem;
            background-color: var(--text-dark);
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .nav-item i { font-size: 1.3rem; }

        /* --- মেইন কন্টেন্ট --- */
        .main-wrapper { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
        .top-header { padding: 2rem 4rem; display: flex; justify-content: space-between; align-items: center; }

        .search-bar { position: relative; width: 350px; }
        .search-bar i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 1.2rem; }
        .search-input {
            width: 100%; padding: 1rem 1rem 1rem 3.5rem;
            border: none; border-radius: 50px;
            background-color: var(--sidebar-bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            font-family: var(--font-sans); font-size: 0.95rem;
            outline: none; transition: box-shadow 0.3s ease;
            box-sizing: border-box;
        }
        .search-input:focus { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        .user-profile { display: flex; align-items: center; gap: 15px; font-weight: 600; }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background-color: var(--accent); color: white;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-serif); font-size: 1.2rem;
        }

        .content-area { padding: 0 4rem 4rem 4rem; }
        .hero-title { font-family: var(--font-serif); font-size: 3rem; font-weight: 700; margin: 0 0 10px 0; }
        .hero-subtitle { color: var(--text-light); font-size: 1.1rem; margin: 0 0 3rem 0; max-width: 600px; line-height: 1.6; }

        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; }
        .section-title { font-family: var(--font-serif); font-size: 1.6rem; margin: 0; }
        .author-filter { padding: 0.6rem 1.2rem; border: 1px solid var(--border-color); border-radius: 30px; background-color: transparent; font-family: var(--font-sans); font-size: 0.95rem; outline: none; cursor: pointer; }

        /* --- বইয়ের গ্রিড --- */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 2.5rem 1.5rem; }
        .book-card { display: flex; flex-direction: column; gap: 1rem; text-decoration: none; }

        .book-cover-wrapper {
            position: relative; width: 100%; aspect-ratio: 2 / 3;
            border-radius: 4px 12px 12px 4px;
            box-shadow: -3px 0 5px rgba(0,0,0,0.1) inset, 8px 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 1rem; text-align: center; box-sizing: border-box;
        }

        .book-cover-wrapper::after {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 15px;
            background: linear-gradient(to right, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 20%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.2) 100%);
            z-index: 5; /* স্পাইন ইফেক্ট ছবির উপরে থাকবে */
        }

        .book-card:hover .book-cover-wrapper { transform: translateY(-10px) rotateY(-5deg); box-shadow: -3px 0 5px rgba(0,0,0,0.1) inset, 15px 20px 30px rgba(0,0,0,0.15); }

        .cover-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); margin: 0 0 0.5rem 0; }
        .cover-author { font-size: 0.8rem; color: rgba(255,255,255,0.9); text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        .info-title { font-family: var(--font-serif); font-weight: 700; font-size: 1.1rem; color: var(--text-dark); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info-author { color: var(--text-light); font-size: 0.9rem; margin: 0 0 5px 0; }
        
        .empty-state { grid-column: 1 / -1; padding: 4rem; text-align: center; color: var(--text-light); font-family: var(--font-serif); font-size: 1.2rem; }

        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main-wrapper { margin-left: 0; }
            .top-header { padding: 1.5rem 2rem; flex-direction: column; gap: 1rem; align-items: flex-start; }
            .content-area { padding: 0 2rem 2rem 2rem; }
            .hero-title { font-size: 2.2rem; }
            .search-bar { width: 100%; }
            .user-profile { display: none; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><i class="ph-fill ph-books"></i> HM 16</div>
        <ul class="nav-menu">
            <li class="nav-item">
                <i class="ph ph-squares-four"></i>
                সব বই
            </li>
        </ul>
    </aside>

    <main class="main-wrapper">
        <header class="top-header">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass"></i>
                <input type="text" id="searchBox" class="search-input" placeholder="বইয়ের নাম বা লেখক খুঁজুন...">
            </div>
            <div class="user-profile">
                <span style="color: var(--text-light);">HM Hashem</span>
                <div class="avatar">H</div>
            </div>
        </header>

        <div class="content-area">
            <h1 class="hero-title">শুভ পঠন, পাঠক!</h1>
            <p class="hero-subtitle">আপনার প্রিয় ই-বুকগুলোর স্মার্ট সংগ্রহশালা। এখন গুগল থেকে স্বয়ংক্রিয়ভাবে বইয়ের কভার খোঁজার চেষ্টা করা হচ্ছে।</p>

            <div class="section-header">
                <h2 class="section-title">বইয়ের তালিকা (<span id="bookCount">০</span>)</h2>
                <select id="authorFilter" class="author-filter">
                    <option value="all">সব লেখক</option>
                </select>
            </div>
            
            <div class="books-grid" id="grid">
                <div class="empty-state">লোড হচ্ছে...</div>
            </div>
        </div>
    </main>

    <script>
        let allBooks = [];

        const aestheticGradients = [
            'linear-gradient(135deg, #7A8B88 0%, #4A5D5A 100%)', 'linear-gradient(135deg, #D4A373 0%, #BC8A5F 100%)',
            'linear-gradient(135deg, #7D8491 0%, #575D66 100%)', 'linear-gradient(135deg, #B5838D 0%, #90666E 100%)',
            'linear-gradient(135deg, #5C677D 0%, #3D4658 100%)', 'linear-gradient(135deg, #A89B8C 0%, #8A7E71 100%)'
        ];

        async function init() {
            try {
                const res = await fetch('./api/books.json');
                allBooks = await res.json();
                
                if (allBooks.length > 0) {
                    allBooks.forEach(book => { book.title = book.title.trim(); book.author = book.author.trim(); });
                    allBooks.sort((a, b) => a.title.localeCompare(b.title, 'bn-BD'));
                    setupFilters();
                    render(allBooks);
                } else {
                    document.getElementById('grid').innerHTML = '<div class="empty-state">কোনো বই পাওয়া যায়নি।</div>';
                }
            } catch (err) {
                document.getElementById('grid').innerHTML = '<div class="empty-state">ডেটা লোড করতে সমস্যা হচ্ছে।</div>';
            }
        }

        function setupFilters() {
            const authors = [...new Set(allBooks.map(b => b.author))].sort((a, b) => a.localeCompare(b, 'bn-BD'));
            const select = document.getElementById('authorFilter');
            authors.forEach(author => {
                if(author === "অজানা") return;
                const opt = document.createElement('option');
                opt.value = author; opt.textContent = author;
                select.appendChild(opt);
            });
        }

        function render(books) {
            const grid = document.getElementById('grid');
            document.getElementById('bookCount').textContent = books.length;
            grid.innerHTML = '';

            books.forEach((book, index) => {
                const gradient = aestheticGradients[index % aestheticGradients.length];
                const imgId = `cover-img-${index}`;
                
                const card = document.createElement('a');
                card.href = book.download_link;
                card.className = 'book-card';
                card.setAttribute('download', '');
                
                // HTML স্ট্রাকচারে কভার ইমেজের জন্য একটি <img> ট্যাগ রাখা হলো, যা শুরুতে লুকানো থাকবে
                card.innerHTML = `
                    <div class="book-cover-wrapper" style="background: ${gradient};">
                        <img id="${imgId}" src="" alt="Cover" style="display:none; width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:2;">
                        <div style="position:relative; z-index:1; padding: 10px;">
                            <div class="cover-title">${book.title}</div>
                            <div class="cover-author">${book.author}</div>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <h3 class="info-title" title="${book.title}">${book.title}</h3>
                        <p class="info-author">${book.author}</p>
                    </div>
                `;
                grid.appendChild(card);

                // অ্যাসিনক্রোনাসভাবে গুগল বুকস থেকে ছবি আনার কল
                fetchCoverFromGoogle(book.title, book.author, imgId);
            });
        }

        // --- গুগল বুকস এপিআই ম্যাজিক ---
        async function fetchCoverFromGoogle(title, author, imgId) {
            try {
                // বই এবং লেখকের নাম দিয়ে গুগলে সার্চ করা হচ্ছে
                const query = encodeURIComponent(`${title} ${author !== 'অজানা' ? author : ''}`);
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${query}&maxResults=1`);
                const data = await response.json();
                
                // গুগল যদি ছবি পায়, তবে সেটা বসিয়ে দেওয়া হবে
                if (data.items && data.items[0].volumeInfo && data.items[0].volumeInfo.imageLinks) {
                    // http কে https এ কনভার্ট করা (নিরাপত্তার জন্য)
                    const imgUrl = data.items[0].volumeInfo.imageLinks.thumbnail.replace('http:', 'https:');
                    
                    const imgElement = document.getElementById(imgId);
                    if (imgElement) {
                        imgElement.src = imgUrl;
                        imgElement.style.display = 'block'; // ছবি পেয়ে গেলে সেটা শো করাবে, পেছনের টেক্সট ঢাকা পড়ে যাবে
                    }
                }
            } catch (error) {
                // যদি ছবি না পায় বা ইন্টারনেট সমস্যা থাকে, কিছুই করবে না। আগের সুন্দর ডিজাইনটাই থেকে যাবে।
                console.log(`Cover not found for: ${title}`);
            }
        }

        function handleSearch() {
            const term = document.getElementById('searchBox').value.toLowerCase();
            const selectedAuthor = document.getElementById('authorFilter').value;
            const filtered = allBooks.filter(b => {
                return (b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term)) &&
                       (selectedAuthor === 'all' || b.author === selectedAuthor);
            });
            render(filtered);
        }

        document.getElementById('searchBox').addEventListener('input', handleSearch);
        document.getElementById('authorFilter').addEventListener('change', handleSearch);

        init();
    </script>
</body>
</html>
