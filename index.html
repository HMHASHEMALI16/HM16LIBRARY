<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM 16 Library</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        header { background-color: #1a252f; color: #ffffff; text-align: center; padding: 2.5rem 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 2.2rem; }
        header p { margin: 0.5rem 0 0 0; color: #bdc3c7; }
        .search-container { max-width: 600px; margin: -1.5rem auto 2rem auto; padding: 0 1rem; }
        .search-box { width: 100%; padding: 1rem 1.5rem; font-size: 1.1rem; border: none; border-radius: 50px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); outline: none; box-sizing: border-box; }
        .main-content { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem 3rem 1.5rem; }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .book-card { background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #eef2f5; }
        .book-details { padding: 1.5rem; }
        .book-title { font-size: 1.25rem; margin: 0 0 0.5rem 0; color: #2c3e50; }
        .book-author { font-size: 1rem; color: #16a085; margin: 0 0 1rem 0; font-weight: 600; }
        .badge { background-color: #e8f8f5; color: #1e8449; padding: 0.25rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
        .download-btn { display: block; background-color: #1abc9c; color: #ffffff; text-align: center; padding: 1rem; text-decoration: none; font-weight: 600; }
        .download-btn:hover { background-color: #16a085; }
        .status-message { text-align: center; font-size: 1.2rem; color: #7f8c8d; margin-top: 3rem; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <h1>HM 16 Library</h1>
        <p>আপনার প্রিয় ই-বুকগুলোর ডিজিটাল সংগ্রহশালা</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchBox" class="search-box" placeholder="বইয়ের নাম অথবা লেখকের নাম দিয়ে খুঁজুন...">
    </div>

    <main class="main-content">
        <div id="booksGrid" class="books-grid">
            <div class="status-message">বইয়ের তালিকা লোড হচ্ছে...</div>
        </div>
    </main>

    <script>
        let allBooks = [];

        // API থেকে ডেটা আনা
        async function fetchBooks() {
            const booksGrid = document.getElementById('booksGrid');
            try {
                const response = await fetch('./api/books.json');
                allBooks = await response.json();
                
                if (allBooks.length === 0) {
                    booksGrid.innerHTML = '<div class="status-message">কোনো বই পাওয়া যায়নি।</div>';
                } else {
                    displayBooks(allBooks);
                }
            } catch (error) {
                booksGrid.innerHTML = '<div class="status-message" style="color: #e74c3c;">লোড করতে সমস্যা হয়েছে।</div>';
            }
        }

        // বইগুলো কার্ড আকারে দেখানো
        function displayBooks(books) {
            const booksGrid = document.getElementById('booksGrid');
            booksGrid.innerHTML = ''; 

            if (books.length === 0) {
                booksGrid.innerHTML = '<div class="status-message">আপনার খোঁজা বইটি লাইব্রেরিতে নেই।</div>';
                return;
            }

            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-details">
                        <h2 class="book-title">${book.title}</h2>
                        <p class="book-author">লেখক: ${book.author}</p>
                        <span class="badge">${book.format}</span>
                    </div>
                    <a href="${book.download_link}" class="download-btn" download>ডাউনলোড করুন</a>
                `;
                booksGrid.appendChild(card);
            });
        }

        // বইয়ের নাম বা লেখকের নাম দিয়ে সার্চ করা
        document.getElementById('searchBox').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            const filteredBooks = allBooks.filter(book => 
                book.title.toLowerCase().includes(searchTerm) || 
                book.author.toLowerCase().includes(searchTerm)
            );
            displayBooks(filteredBooks);
        });

        window.addEventListener('DOMContentLoaded', fetchBooks);
    </script>
</body>
</html>
