<!DOCTYPE html>  
<html lang="bn" data-theme="light">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>HM 16 LIBRARY</title>  
      
    <link rel="preconnect" href="https://fonts.googleapis.com">  
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@600;700&display=swap" rel="stylesheet">  
      
    <script src="https://unpkg.com/@phosphor-icons/web"></script>  
  
    <script>  
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');  
        document.documentElement.setAttribute('data-theme', savedTheme);  
    </script>  
  
    <style>  
        /* --- গ্লোবাল রিসেট --- */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* --- থিম ভ্যারিয়েবল --- */  
        :root {  
            --bg-main: #F9F8F4;        
            --card-bg: #FFFFFF;  
            --text-dark: #2B2824;      
            --text-light: #8A867D;     
            --accent: #D96C4A;         
            --border-color: #EAE6DF;  
            --card-shadow: 0 4px 15px rgba(0,0,0,0.04);  
              
            --font-serif: 'Noto Serif Bengali', serif;  
            --font-sans: 'Noto Sans Bengali', sans-serif;  
        }  
  
        [data-theme="dark"] {  
            --bg-main: #181614;        
            --card-bg: #221F1C;  
            --text-dark: #EAE6DF;      
            --text-light: #9C988F;     
            --accent: #E58263;         
            --border-color: #36322D;  
            --card-shadow: 0 4px 15px rgba(0,0,0,0.4);  
        }  
  
        body {  
            margin: 0; 
            padding: 0; 
            font-family: var(--font-sans);  
            background-color: var(--bg-main); 
            color: var(--text-dark);  
            -webkit-font-smoothing: antialiased;  
            transition: background-color 0.3s ease, color 0.3s ease;  
            overflow-x: hidden; 
            line-height: 1.5;
        }  
  
        /* --- ড্রয়ার (সাইড মেনু) --- */  
        .backdrop {  
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;  
            background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);  
            z-index: 999; opacity: 0; visibility: hidden; transition: all 0.3s ease;  
        }  
        .drawer {  
            position: fixed; top: 0; left: -280px; width: 280px; height: 100vh;  
            background: var(--card-bg); z-index: 1000;  
            box-shadow: 4px 0 20px rgba(0,0,0,0.1);  
            transition: left 0.3s ease; display: flex; flex-direction: column;  
        }  
        .drawer.open { left: 0; }  
        .backdrop.open { opacity: 1; visibility: visible; }  
  
        .drawer-header {  
            padding: 1.5rem; display: flex; justify-content: space-between; align-items: center;  
            border-bottom: 1px solid var(--border-color);  
        }  
        .drawer-header h2 { margin: 0; font-family: var(--font-serif); font-size: 1.2rem; }  
        .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-dark); cursor: pointer; padding: 0; transition: color 0.2s;}  
        .close-btn:hover { color: var(--accent); }

        .drawer-content { flex: 1; overflow-y: auto; padding: 1rem 0; }  
        .drawer-item {  
            padding: 0.8rem 1.5rem; margin: 0.3rem 1rem; border-radius: 8px;  
            cursor: pointer; font-weight: 500; color: var(--text-dark);  
            display: flex; align-items: center; gap: 10px; transition: 0.2s;  
        }  
        .drawer-item:hover { background: var(--bg-main); }  
        .drawer-item.active { background: var(--text-dark); color: var(--card-bg); }  
          
        .drawer-title { padding: 1rem 1.5rem 0.5rem; font-size: 0.85rem; color: var(--text-light); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;}  
  
        /* --- মেইন কন্টেইনার --- */  
        .container {   
            max-width: 1100px;   
            margin: 0 auto;   
            padding: 2rem 1.5rem;   
            width: 100%;  
        }  
  
        /* --- টপ নেভিগেশন ব্যালান্সিং --- */
        .top-nav {  
            display: flex; justify-content: space-between; align-items: center;  
            margin-bottom: 2.5rem; gap: 1.5rem; flex-wrap: wrap;  
        }  
  
        .nav-left { display: flex; align-items: center; gap: 1rem; }  
        .menu-btn {  
            background: var(--card-bg); border: 1px solid var(--border-color);  
            width: 44px; height: 44px; border-radius: 10px; font-size: 1.4rem;  
            color: var(--text-dark); cursor: pointer; display: flex; align-items: center; justify-content: center;  
            box-shadow: var(--card-shadow); padding: 0; transition: all 0.2s;
        }  
        .menu-btn:hover { border-color: var(--text-light); }
          
        .main-heading { font-family: var(--font-serif); font-size: 1.6rem; margin: 0; font-weight: 700; letter-spacing: 0.5px; }  
  
        .nav-right { display: flex; gap: 1rem; flex: 1; justify-content: flex-end; align-items: center; }  
        
        .search-wrapper { flex: 1; max-width: 400px; position: relative; }  
        .search-wrapper i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 1.2rem; }  
        .search-input {  
            width: 100%; height: 44px; padding: 0 1.2rem 0 2.8rem; border: 1px solid var(--border-color); border-radius: 50px;  
            background: var(--card-bg); color: var(--text-dark); font-family: var(--font-sans); font-size: 0.95rem;  
            outline: none; box-shadow: var(--card-shadow); transition: all 0.3s;  
        }  
        .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(217, 108, 74, 0.1); }  
  
        /* --- সেকশন হেডার --- */  
        .section-header {  
            display: flex; justify-content: space-between; align-items: flex-end;  
            margin-bottom: 1.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.8rem;  
        }  
        .section-title { font-family: var(--font-serif); font-size: 1.3rem; margin: 0; font-weight: 700; display: flex; gap: 8px; align-items: center; }  
        .book-count { font-family: var(--font-sans); color: var(--text-light); font-size: 1rem; font-weight: normal; margin-top: 2px; }  
        #currentFilterText { font-size: 0.95rem; color: var(--text-light); font-weight: 600; }

        /* --- বইয়ের গ্রিড ব্যালান্সিং --- */  
        .books-grid {   
            display: grid;   
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));   
            gap: 1.5rem;   
        }  
  
        .book-card {   
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;  
            padding: 1.5rem 1.2rem; display: flex; flex-direction: column; align-items: center;  
            text-decoration: none; box-shadow: var(--card-shadow);  
            transition: all 0.3s ease; height: 100%; justify-content: flex-start;
        }  
        .book-card:hover { transform: translateY(-5px); border-color: var(--text-light); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }  
  
        /* --- বইয়ের কভার --- */  
        .book-cover-wrapper {  
            position: relative;   
            width: 100%; max-width: 140px;  
            aspect-ratio: 2 / 3;  
            border-radius: 4px 8px 8px 4px;  
            box-shadow: -2px 0 5px rgba(0,0,0,0.15) inset, 4px 6px 12px rgba(0,0,0,0.1);  
            margin-bottom: 1.2rem; display: flex; flex-direction: column; justify-content: center; align-items: center;  
            padding: 1rem; text-align: center; overflow: hidden;
        }  
        .book-cover-wrapper::after {  
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 8px;  
            background: linear-gradient(to right, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 20%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.2) 100%);  
            z-index: 5;  
        }  
  
        .cover-title { font-family: var(--font-serif); font-size: 0.95rem; font-weight: 700; color: #FFFFFF; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); margin: 0 0 6px 0; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; z-index: 2;}  
        .cover-author { font-size: 0.75rem; color: rgba(255,255,255,0.9); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); z-index: 2;}  
  
        .info-title { font-family: var(--font-serif); font-weight: 700; font-size: 1.05rem; color: var(--text-dark); margin: 0 0 6px 0; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  
        .info-author { color: var(--text-light); font-size: 0.9rem; margin: 0; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  
  
        .empty-state { grid-column: 1 / -1; padding: 4rem 1rem; text-align: center; color: var(--text-light); font-family: var(--font-serif); font-size: 1.2rem; }  
  
        /* --- মোবাইল রেস্পন্সিভনেস --- */  
        @media (max-width: 600px) {  
            .container { padding: 1.2rem; }  
            
            /* মোবাইল টপ-ন্যাভ ব্যালান্সিং */
            .top-nav { flex-direction: column; align-items: stretch; gap: 1rem; margin-bottom: 1.5rem; }  
            .nav-left { justify-content: space-between; width: 100%; }  
            .nav-right { width: 100%; justify-content: space-between; gap: 10px; }  
            .search-wrapper { max-width: 100%; }  
              
            .main-heading { font-size: 1.4rem; }  
              
            .section-header { flex-direction: row; align-items: center; padding-bottom: 0.6rem;}  
            .section-title { font-size: 1.15rem; }  
              
            /* ফিক্সড ২ কলাম লেআউট স্পেসিং ব্যালান্সিং */  
            .books-grid {   
                grid-template-columns: repeat(2, 1fr);   
                gap: 1rem; /* গ্যাপ অপ্টিমাইজ করা হয়েছে */
            }  
            .book-card { padding: 1rem 0.8rem; border-radius: 10px; }  
            .book-cover-wrapper { max-width: 100px; margin-bottom: 1rem; padding: 0.6rem; border-radius: 3px 6px 6px 3px; }  
            .book-cover-wrapper::after { width: 6px; }  
              
            .cover-title { font-size: 0.8rem; }  
            .cover-author { font-size: 0.65rem; }  
            .info-title { font-size: 0.9rem; }  
            .info-author { font-size: 0.8rem; }  
        }  
    </style>  
</head>  
<body>  
  
    <!-- ড্রয়ার ও ব্যাকড্রপ -->  
    <div class="backdrop" id="backdrop" onclick="toggleDrawer()"></div>  
    <aside class="drawer" id="drawer">  
        <div class="drawer-header">  
            <h2>HM 16 LIBRARY</h2>  
            <button class="close-btn" onclick="toggleDrawer()"><i class="ph ph-x"></i></button>  
        </div>  
        <div class="drawer-content">  
            <div class="drawer-item active" id="allBooksBtn" onclick="selectAuthor('all')">  
                <i class="ph ph-books"></i> সব বই  
            </div>  
            <div class="drawer-title">লেখকদের তালিকা</div>  
            <div id="drawerAuthorList">  
                <!-- ডায়নামিক লিস্ট এখানে আসবে -->  
            </div>  
        </div>  
    </aside>  
  
    <div class="container">  
        <!-- টপ হেডার -->  
        <header class="top-nav">  
            <div class="nav-left">  
                <button class="menu-btn" onclick="toggleDrawer()"><i class="ph ph-list"></i></button>  
                <h1 class="main-heading">HM 16 LIBRARY</h1>  
            </div>  
              
            <div class="nav-right">  
                <div class="search-wrapper">  
                    <i class="ph ph-magnifying-glass"></i>  
                    <input type="text" id="searchBox" class="search-input" placeholder="বইয়ের নাম বা লেখক খুঁজুন...">  
                </div>  
                <button class="menu-btn" onclick="toggleTheme()"><i class="ph ph-moon" id="themeIcon"></i></button>  
            </div>  
        </header>  
  
        <!-- সেকশন হেডার -->  
        <div class="section-header">  
            <h2 class="section-title">বইয়ের তালিকা <span class="book-count" id="bookCount">(০)</span></h2>  
            <span id="currentFilterText">সব লেখক</span>  
        </div>  
          
        <!-- বইয়ের গ্রিড -->  
        <div class="books-grid" id="grid">  
            <div class="empty-state">বই লোড হচ্ছে...</div>  
        </div>  
    </div>  
  
    <script>  
        // থিম টগল  
        function updateThemeIcon() {  
            const theme = document.documentElement.getAttribute('data-theme');  
            const icon = document.getElementById('themeIcon');  
            if (theme === 'dark') { icon.classList.replace('ph-moon', 'ph-sun'); }   
            else { icon.classList.replace('ph-sun', 'ph-moon'); }  
        }  
        function toggleTheme() {  
            const current = document.documentElement.getAttribute('data-theme');  
            const newTheme = current === 'dark' ? 'light' : 'dark';  
            document.documentElement.setAttribute('data-theme', newTheme);  
            localStorage.setItem('theme', newTheme);  
            updateThemeIcon();  
        }  
        updateThemeIcon();  
  
        // ড্রয়ার টগল  
        function toggleDrawer() {  
            document.getElementById('drawer').classList.toggle('open');  
            document.getElementById('backdrop').classList.toggle('open');  
        }  
  
        let allBooks = [];  
        let selectedAuthor = 'all';  
  
        // ৭টি প্রিমিয়াম কালার ডিজাইন  
        const coverStyles = [  
            'linear-gradient(135deg, #1f4037 0%, #99f2c8 100%)',   
            'linear-gradient(135deg, #4b134f 0%, #c94b4b 100%)',   
            'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)',   
            'linear-gradient(135deg, #870000 0%, #190a05 100%)',   
            'linear-gradient(135deg, #373B44 0%, #4286f4 100%)',   
            'linear-gradient(135deg, #7b4397 0%, #dc2430 100%)',   
            'linear-gradient(135deg, #283c86 0%, #45a247 100%)'    
        ];  
  
        async function init() {  
            try {  
                const res = await fetch('./api/books.json');  
                allBooks = await res.json();  
                  
                if (allBooks.length > 0) {  
                    allBooks.forEach(book => { book.title = book.title.trim(); book.author = book.author.trim(); });  
                    allBooks.sort((a, b) => a.title.localeCompare(b.title, 'bn-BD'));  
                    setupDrawer();  
                    render(allBooks);  
                } else {  
                    document.getElementById('grid').innerHTML = '<div class="empty-state">কোনো বই পাওয়া যায়নি।</div>';  
                }  
            } catch (err) {  
                document.getElementById('grid').innerHTML = '<div class="empty-state">ডেটা লোড করতে সমস্যা হচ্ছে।</div>';  
            }  
        }  
  
        function setupDrawer() {  
            const authors = [...new Set(allBooks.map(b => b.author))].sort((a, b) => a.localeCompare(b, 'bn-BD'));  
            const drawerList = document.getElementById('drawerAuthorList');  
              
            authors.forEach(author => {  
                if(author === "অজানা") return;  
                const item = document.createElement('div');  
                item.className = 'drawer-item';  
                item.innerHTML = `<i class="ph ph-user"></i> ${author}`;  
                item.onclick = () => selectAuthor(author, item);  
                drawerList.appendChild(item);  
            });  
        }  
  
        function selectAuthor(author, element = null) {  
            selectedAuthor = author;  
            document.querySelectorAll('.drawer-item').forEach(el => el.classList.remove('active'));  
            if(element) { element.classList.add('active'); }   
            else { document.getElementById('allBooksBtn').classList.add('active'); }  
              
            document.getElementById('currentFilterText').textContent = author === 'all' ? 'সব লেখক' : author;  
            document.getElementById('searchBox').value = '';   
            handleSearch();  
            toggleDrawer();  
        }  
  
        function render(books) {  
            const grid = document.getElementById('grid');  
            document.getElementById('bookCount').textContent = `(${books.length})`;  
            grid.innerHTML = '';  
  
            if(books.length === 0) {  
                grid.innerHTML = '<div class="empty-state">বই পাওয়া যায়নি।</div>';  
                return;  
            }  
  
            books.forEach((book, index) => {  
                const colorIndex = (index * 3 + 7) % coverStyles.length;  
                const gradient = coverStyles[colorIndex];  
                  
                const card = document.createElement('a');  
                card.href = book.download_link;  
                card.className = 'book-card';  
                card.setAttribute('download', '');  
                  
                card.innerHTML = `  
                    <div class="book-cover-wrapper" style="background: ${gradient};">  
                        <div class="cover-title">${book.title}</div>  
                        <div class="cover-author">${book.author}</div>  
                    </div>  
                    <h3 class="info-title" title="${book.title}">${book.title}</h3>  
                    <p class="info-author">${book.author}</p>  
                `;  
                grid.appendChild(card);  
            });  
        }  
  
        function handleSearch() {  
            const term = document.getElementById('searchBox').value.toLowerCase();  
            const filtered = allBooks.filter(b => {  
                return (b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term)) &&  
                       (selectedAuthor === 'all' || b.author === selectedAuthor);  
            });  
            render(filtered);  
        }  
  
        document.getElementById('searchBox').addEventListener('input', handleSearch);  
  
        init();  
    </script>  
</body>  
</html>
