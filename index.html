<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM 16 LIBRARY| Digital Library</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        /* --- লাইট থিম --- */
        :root {
            --bg-main: #F9F8F4;      
            --sidebar-bg: #FFFFFF;
            --text-dark: #2B2824;    
            --text-light: #8A867D;   
            --accent: #D96C4A;       
            --border-color: #EAE6DF;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.04);
            --card-bg: #FFFFFF;
            
            --font-serif: 'Noto Serif Bengali', serif;
            --font-sans: 'Noto Sans Bengali', sans-serif;
        }

        /* --- ডার্ক থিম --- */
        [data-theme="dark"] {
            --bg-main: #181614;      
            --sidebar-bg: #221F1C;
            --text-dark: #EAE6DF;    
            --text-light: #9C988F;   
            --accent: #E58263;       
            --border-color: #36322D;
            --card-shadow: 0 4px 20px rgba(0,0,0,0.2);
            --card-bg: #2A2622;
        }

        body {
            margin: 0; padding: 0; font-family: var(--font-sans);
            background-color: var(--bg-main); color: var(--text-dark);
            display: flex; min-height: 100vh; overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* --- সাইডবার --- */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 2.5rem 1.5rem;
            position: fixed; height: 100vh; box-sizing: border-box; z-index: 50;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .logo { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 3rem; }
        .logo i { color: var(--accent); }

        .nav-menu { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 1rem 1.2rem; border-radius: 12px;
            font-weight: 500; font-size: 1.05rem; background-color: var(--text-dark); color: var(--bg-main);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: pointer;
        }
        .nav-item i { font-size: 1.3rem; }

        /* --- মেইন কন্টেন্ট --- */
        .main-wrapper { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
        .top-header { padding: 2rem 4rem; display: flex; justify-content: space-between; align-items: center; }
        .header-controls { display: flex; align-items: center; gap: 1rem; flex: 1; }
        
        .search-bar { position: relative; width: 100%; max-width: 350px; }
        .search-bar i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 1.2rem; }
        .search-input {
            width: 100%; padding: 1rem 1rem 1rem 3.5rem; border: 1px solid var(--border-color); border-radius: 50px;
            background-color: var(--sidebar-bg); color: var(--text-dark); box-shadow: var(--card-shadow);
            font-family: var(--font-sans); font-size: 0.95rem; outline: none; transition: all 0.3s ease; box-sizing: border-box;
        }
        .search-input:focus { border-color: var(--accent); }

        .theme-toggle-btn {
            background: var(--sidebar-bg); border: 1px solid var(--border-color);
            color: var(--text-dark); width: 45px; height: 45px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
            cursor: pointer; transition: all 0.3s ease;
        }

        .user-profile { display: flex; align-items: center; gap: 15px; font-weight: 600; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background-color: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 1.2rem; }

        .content-area { padding: 0 4rem 4rem 4rem; }
        .hero-title { font-family: var(--font-serif); font-size: 3rem; font-weight: 700; margin: 0 0 10px 0; }
        .hero-subtitle { color: var(--text-light); font-size: 1.1rem; margin: 0 0 3rem 0; }

        .section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 1rem; }
        .section-title { font-family: var(--font-serif); font-size: 1.6rem; margin: 0; }
        .author-filter { padding: 0.6rem 1.2rem; border: 1px solid var(--border-color); border-radius: 30px; background-color: var(--sidebar-bg); color: var(--text-dark); font-family: var(--font-sans); outline: none; cursor: pointer; }

        /* --- বইয়ের গ্রিড (এক লাইনে ৩টি বই) --- */
        .books-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 2rem; 
        }

        /* --- কার্ড ডিজাইন --- */
        .book-card { 
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .book-card:hover { transform: translateY(-6px); box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-color: var(--accent); }

        /* --- ছোট করা বইয়ের কভার --- */
        .book-cover-wrapper {
            position: relative; 
            width: 120px; /* কভার সাইজ ছোট করা হয়েছে */
            height: 180px;
            border-radius: 3px 8px 8px 3px;
            box-shadow: -2px 0 4px rgba(0,0,0,0.2) inset, 6px 8px 15px rgba(0,0,0,0.15);
            margin-bottom: 1.2rem;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 0.8rem; text-align: center; box-sizing: border-box;
            transition: transform 0.3s ease;
        }
        .book-cover-wrapper::after {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px;
            background: linear-gradient(to right, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 20%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.2) 100%);
            z-index: 5; pointer-events: none;
        }
        .book-card:hover .book-cover-wrapper { transform: scale(1.05) rotateY(-5deg); }

        .cover-title { font-family: var(--font-serif); font-size: 0.95rem; font-weight: 700; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.6); margin: 0 0 0.5rem 0; line-height: 1.3; }
        .cover-author { font-size: 0.7rem; color: rgba(255,255,255,0.9); text-shadow: 1px 1px 2px rgba(0,0,0,0.6); }

        /* --- বইয়ের ইনফো ও ডাউনলোড বাটন --- */
        .info-title { font-family: var(--font-serif); font-weight: 700; font-size: 1.15rem; color: var(--text-dark); margin: 0 0 4px 0; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info-author { color: var(--text-light); font-size: 0.9rem; margin: 0 0 1.2rem 0; text-align: center; }

        .download-btn {
            background-color: var(--bg-main);
            color: var(--text-dark);
            border: 1px solid var(--border-color);
            width: 100%; padding: 0.7rem 0;
            border-radius: 50px;
            font-size: 0.9rem; font-weight: 600;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.3s ease;
        }
        .book-card:hover .download-btn {
            background-color: var(--text-dark);
            color: var(--bg-main);
            border-color: var(--text-dark);
        }

        .empty-state { grid-column: 1 / -1; padding: 4rem; text-align: center; color: var(--text-light); font-family: var(--font-serif); font-size: 1.2rem; }

        @media (max-width: 1100px) {
            .books-grid { grid-template-columns: repeat(2, 1fr); } /* ট্যাবলেটে ২টি */
        }
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main-wrapper { margin-left: 0; }
            .top-header { padding: 1.5rem 2rem; flex-direction: column-reverse; gap: 1.5rem; align-items: flex-start; }
            .header-controls { width: 100%; justify-content: space-between; }
            .content-area { padding: 0 2rem 2rem 2rem; }
            .search-bar { width: 100%; max-width: none; }
            .user-profile { display: none; }
        }
        @media (max-width: 600px) {
            .books-grid { grid-template-columns: 1fr; } /* মোবাইলে ১টি */
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo"><i class="ph-fill ph-books"></i> HM 16</div>
        <ul class="nav-menu">
            <li class="nav-item"><i class="ph ph-squares-four"></i> সব বই</li>
        </ul>
    </aside>

    <main class="main-wrapper">
        <header class="top-header">
            <div class="header-controls">
                <div class="search-bar">
                    <i class="ph ph-magnifying-glass"></i>
                    <input type="text" id="searchBox" class="search-input" placeholder="বইয়ের নাম বা লেখক খুঁজুন...">
                </div>
                <button class="theme-toggle-btn" onclick="toggleTheme()"><i class="ph ph-moon" id="themeIcon"></i></button>
            </div>
            <div class="user-profile"><span style="color: var(--text-light);">HM Hashem</span><div class="avatar">H</div></div>
        </header>

        <div class="content-area">
            <h1 class="hero-title">শুভ পঠন, পাঠক!</h1>
            <p class="hero-subtitle">কোনো এপিআই বা এক্সট্রা লিংকের ঝামেলা নেই। পিওর ডিজাইন আর আপনার প্রিয় ই-বুক।</p>

            <div class="section-header">
                <h2 class="section-title">বইয়ের তালিকা (<span id="bookCount">০</span>)</h2>
                <select id="authorFilter" class="author-filter"><option value="all">সব লেখক</option></select>
            </div>
            
            <div class="books-grid" id="grid">
                <div class="empty-state">লোড হচ্ছে...</div>
            </div>
        </div>
    </main>

    <script>
        function updateThemeIcon() {
            const theme = document.documentElement.getAttribute('data-theme');
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') { icon.classList.replace('ph-moon', 'ph-sun'); } 
            else { icon.classList.replace('ph-sun', 'ph-moon'); }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon();
        }
        updateThemeIcon();

        let allBooks = [];

        // ৭টি প্রিমিয়াম ভিন্ন রঙের কভার ডিজাইন
        const coverStyles = [
            'linear-gradient(135deg, #1f4037 0%, #99f2c8 100%)', // Mint / Dark Green
            'linear-gradient(135deg, #4b134f 0%, #c94b4b 100%)', // Crimson / Purple
            'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)', // Midnight Blue
            'linear-gradient(135deg, #870000 0%, #190a05 100%)', // Deep Blood Red
            'linear-gradient(135deg, #373B44 0%, #4286f4 100%)', // Slate / Blue
            'linear-gradient(135deg, #7b4397 0%, #dc2430 100%)', // Sunset Purple
            'linear-gradient(135deg, #283c86 0%, #45a247 100%)'  // Forest / Ocean
        ];

        async function init() {
            try {
                const res = await fetch('./api/books.json');
                allBooks = await res.json();
                
                if (allBooks.length > 0) {
                    allBooks.forEach(book => { book.title = book.title.trim(); book.author = book.author.trim(); });
                    allBooks.sort((a, b) => a.title.localeCompare(b.title, 'bn-BD'));
                    setupFilters();
                    render(allBooks);
                } else {
                    document.getElementById('grid').innerHTML = '<div class="empty-state">কোনো বই পাওয়া যায়নি।</div>';
                }
            } catch (err) {
                document.getElementById('grid').innerHTML = '<div class="empty-state">ডেটা লোড করতে সমস্যা হচ্ছে।</div>';
            }
        }

        function setupFilters() {
            const authors = [...new Set(allBooks.map(b => b.author))].sort((a, b) => a.localeCompare(b, 'bn-BD'));
            const select = document.getElementById('authorFilter');
            authors.forEach(author => {
                if(author === "অজানা") return;
                const opt = document.createElement('option');
                opt.value = author; opt.textContent = author;
                select.appendChild(opt);
            });
        }

        function render(books) {
            const grid = document.getElementById('grid');
            document.getElementById('bookCount').textContent = books.length;
            grid.innerHTML = '';

            books.forEach((book, index) => {
                // nCr/nPr style permutation: ইনডেক্সের সাথে একটু ম্যাথ করে কালার র‍্যান্ডমাইজ করা হয়েছে
                const colorIndex = (index * 3 + 7) % coverStyles.length;
                const gradient = coverStyles[colorIndex];
                
                const card = document.createElement('a');
                card.href = book.download_link;
                card.className = 'book-card';
                card.setAttribute('download', '');
                
                card.innerHTML = `
                    <div class="book-cover-wrapper" style="background: ${gradient};">
                        <div class="cover-title">${book.title}</div>
                        <div class="cover-author">${book.author}</div>
                    </div>
                    
                    <h3 class="info-title" title="${book.title}">${book.title}</h3>
                    <p class="info-author">${book.author}</p>
                    
                    <div class="download-btn">
                        <i class="ph-bold ph-download-simple"></i> Click to Download
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            const term = document.getElementById('searchBox').value.toLowerCase();
            const selectedAuthor = document.getElementById('authorFilter').value;
            const filtered = allBooks.filter(b => {
                return (b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term)) &&
                       (selectedAuthor === 'all' || b.author === selectedAuthor);
            });
            render(filtered);
        }

        document.getElementById('searchBox').addEventListener('input', handleSearch);
        document.getElementById('authorFilter').addEventListener('change', handleSearch);

        init();
    </script>
</body>
</html>
